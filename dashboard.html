<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Doomsage Dashboard</title>
<meta name="description" content="Every site, app and project by Kunal Dewangan (Doomsage), in one place.">
<link rel="canonical" href="https://doomsage.in/dashboard.html">
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0b0a07;--line:rgba(212,175,55,.22);--gold:#D4AF37;--cream:#F8F8D4;--muted:#a8a58f}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--cream);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
background-image:radial-gradient(900px 500px at 50% -10%,rgba(212,175,55,.16),transparent 70%),radial-gradient(600px 400px at 100% 60%,rgba(212,175,55,.06),transparent 70%)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.brand{display:flex;align-items:center;gap:12px;font-family:'Cinzel',serif;letter-spacing:.22em;font-size:.95rem;color:var(--cream)}
.brand img{width:38px;height:38px;object-fit:contain}
.back{font-size:.78rem;letter-spacing:.14em;border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--gold);transition:.25s}
.back:hover{background:rgba(212,175,55,.12)}
.hero{text-align:center;padding:56px 0 40px}
.eyebrow{font-size:.72rem;letter-spacing:.38em;color:var(--gold)}
h1{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(2.1rem,8vw,4.6rem);line-height:1.08;margin:18px 0 16px;
background:linear-gradient(180deg,#fff8d6,#D4AF37 70%,#8f7420);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:560px;margin:0 auto;color:var(--muted);line-height:1.7;font-weight:300;font-size:1.02rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:620px;margin:36px auto 0}
.stat{border:1px solid var(--line);border-radius:16px;padding:16px 8px;background:rgba(212,175,55,.04)}
.stat b{display:block;font-family:'Cinzel',serif;font-size:1.9rem;color:var(--gold)}
.stat span{font-size:.7rem;letter-spacing:.18em;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:42px 0 8px}
.chip{background:none;border:1px solid var(--line);color:var(--cream);border-radius:999px;padding:11px 20px;font:500 .8rem 'Inter';letter-spacing:.08em;cursor:pointer;transition:.25s;min-height:44px}
.chip.on,.chip:hover{background:var(--gold);color:#000;border-color:var(--gold)}
.sec{margin-top:46px}
.sec h2{font-family:'Cinzel',serif;font-size:1.15rem;letter-spacing:.24em;color:var(--gold);font-weight:500;display:flex;align-items:center;gap:16px}
.sec h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:22px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:22px;background:linear-gradient(160deg,#14110a,var(--panel) 60%);border:1px solid var(--line);transition:transform .3s,border-color .3s,box-shadow .3s;min-height:190px}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 18px 50px rgba(212,175,55,.14)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:.64rem;letter-spacing:.2em;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:7px;font-size:.66rem;letter-spacing:.14em;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#555}
.state.up .dot{background:#4ade80;box-shadow:0 0 10px #4ade80}
.state.down .dot{background:#f87171}
.card h3{font-family:'Cinzel',serif;font-size:1.35rem;font-weight:700;color:#fff8d6}
.card p{color:var(--muted);font-weight:300;line-height:1.65;font-size:.95rem;flex:1}
.url{font-size:.74rem;color:var(--gold);letter-spacing:.05em;word-break:break-all;display:flex;justify-content:space-between;align-items:center;gap:10px}
.url i{font-style:normal;font-size:1.1rem;transition:transform .25s}
.card:hover .url i{transform:translate(3px,-3px)}
.badge{position:absolute;top:0;right:22px;transform:translateY(-50%);background:var(--gold);color:#000;font-size:.62rem;font-weight:600;letter-spacing:.16em;padding:5px 11px;border-radius:999px}
.hide{display:none}
footer{margin-top:90px;border-top:1px solid var(--line);padding:34px 0 46px;text-align:center}
footer img{width:46px;height:46px;object-fit:contain;opacity:.95}
footer .big{font-family:'Cinzel',serif;letter-spacing:.5em;color:var(--gold);font-size:1rem;margin-top:12px;padding-left:.5em}
footer p{color:var(--muted);font-size:.74rem;margin-top:10px;letter-spacing:.06em}
@media(max-width:520px){.wrap{padding:0 16px}.hero{padding-top:34px}.brand span{display:none}.stat b{font-size:1.5rem}.card{padding:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.gate img{width:72px;height:72px;object-fit:contain;margin-bottom:18px}
.gate h1{font-size:clamp(1.6rem,6vw,2.4rem);margin:6px 0 8px}
.gate p{color:var(--muted);font-weight:300;font-size:.95rem}
.dots{display:flex;gap:14px;margin:30px 0 26px}
.dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold);transition:.15s}
.dots i.f{background:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.6)}
.dots.err{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:rgba(212,175,55,.05);color:var(--cream);font:500 1.5rem 'Cinzel',serif;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
.pad button:active{background:var(--gold);color:#000}
.pad .ghost{border:none;background:none;font-size:.8rem;letter-spacing:.1em;color:var(--muted)}
.msg{height:20px;margin-top:20px;font-size:.8rem;letter-spacing:.1em;color:#f87171}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/"><img src="https://doomnest.doomsage.in/assets/3-logo.png" alt="Doomsage logo" onerror="this.style.display='none'"><span>DOOMSAGE</span></a>
    <a class="back" href="/">&larr; PORTFOLIO</a>
  </header>
  <section class="hero">
    <p class="eyebrow">KUNAL DEWANGAN &middot; DOOMSAGE</p>
    <h1>The Doomsage<br>Dashboard</h1>
    <p class="sub">My tools and apps, in one place. Tap a card to open it.</p>
  </section>
  <div class="grid" id="grid"></div>
  <footer>
    <img src="https://doomnest.doomsage.in/assets/3-logo.png" alt="" onerror="this.style.display='none'">
    <div class="big">DOOMSAGE</div>
    <p>&copy; 2026 Kunal Dewangan (Doomsage)</p>
  </footer>
</div>
<script>
var P=[
{n:"DoomCloud",t:"CLOUD",u:"https://doomcloud.doomsage.in/",d:"My personal cloud for files, running on my own home server."},
{n:"Insta Fetch",t:"TOOL",u:"https://fetch.doomsage.in/",d:"Download Instagram profile pictures, posts, reels, highlights and stories."},
{n:"DoomNest",t:"APPS",u:"https://doomnest.doomsage.in/",d:"My app store. Every Android app I build is listed here, ready to install."},
{n:"DoomChat",t:"CHAT",u:"https://chat.doomsage.in/",d:"Private chats on your own server."}
];
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var h="";
P.forEach(function(p){
  var host=p.u.replace(/^https?:\/\//,"").replace(/\/$/,"");
  h+='<a class="card" href="'+esc(p.u)+'" target="_blank" rel="noopener" data-u="'+esc(p.u)+'"><div class="row"><span class="tag">'+esc(p.t)+'</span><span class="state"><span class="dot"></span><span class="st">CHECKING</span></span></div><h3>'+esc(p.n)+'</h3><p>'+esc(p.d)+'</p><div class="url"><span>'+esc(host)+'</span><i>&#8599;</i></div></a>';
});
document.getElementById("grid").innerHTML=h;
document.querySelectorAll(".card").forEach(function(card){
  var st=card.querySelector(".state"),lbl=card.querySelector(".st");
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},8000);
  fetch(card.getAttribute("data-u"),{mode:"no-cors",cache:"no-store",signal:ctl.signal}).then(function(){clearTimeout(t);st.className="state up";lbl.textContent="ONLINE"}).catch(function(){clearTimeout(t);st.className="state down";lbl.textContent="OFFLINE"});
});
</script>
</body>
</html>
